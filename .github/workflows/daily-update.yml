name: 毎日のデータ更新と毎週の再学習

on:
  schedule:
    - cron: "0 16 * * *"   # 毎日 01:00 JST
  workflow_dispatch:
    inputs:
      start:
        description: "取得開始日 YYYY-MM-DD（初回の過去データ一括取得用。空なら直近7日）"
        required: false
      train:
        description: "再学習も行う"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y fonts-ipafont-gothic
      - run: pip install -r requirements.txt
      - name: 公式ファイルのキャッシュ
        uses: actions/cache@v4
        with:
          path: data/boat/raw
          key: boat-raw-${{ github.run_id }}
          restore-keys: boat-raw-
      - name: データ更新
        run: |
          if [ -n "${{ inputs.start }}" ]; then
            python -m akapen.cli boat-update --start "${{ inputs.start }}"
          else
            python -m akapen.cli boat-update --days 7
          fi
      - name: 予想の答え合わせ
        run: python -m akapen.cli boat-score
      - name: 再学習（毎週月曜、または手動指定）
        run: |
          if [ "${{ inputs.train }}" = "true" ] || [ "$(TZ=Asia/Tokyo date +%u)" = "1" ]; then
            python -m akapen.cli boat-train
          fi
      - name: 結果を保存
        run: |
          git config user.name "akapen-bot"
          git config user.email "akapen-bot@users.noreply.github.com"
          git add data/boat/races models/boat predictions || true
          git diff --cached --quiet || git commit -m "データ更新 $(TZ=Asia/Tokyo date +%F)"
          git push
