name: 予想PDFを作る

on:
  workflow_dispatch:
    inputs:
      date:
        description: "日付 YYYY-MM-DD（空なら今日）"
        required: false
      venue:
        description: "レース場（例: 住之江。空なら全場。複数はスペース区切り）"
        required: false
        default: "住之江"
      races:
        description: "レース番号（例: 1 2 12。空なら全レース）"
        required: false

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y fonts-ipafont-gothic
      - run: pip install -r requirements.txt
      - name: 予想
        run: |
          D="${{ inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Tokyo date +%F)
          ARGS="--date $D"
          [ -n "${{ inputs.venue }}" ] && ARGS="$ARGS --venue ${{ inputs.venue }}"
          [ -n "${{ inputs.races }}" ] && ARGS="$ARGS --race ${{ inputs.races }}"
          python -m akapen.cli boat-predict $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: yosou-pdf
          path: output/*.pdf
      - name: 予想を記録（あとで答え合わせ）
        run: |
          git config user.name "akapen-bot"
          git config user.email "akapen-bot@users.noreply.github.com"
          git add predictions
          git diff --cached --quiet || git commit -m "予想記録 $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase && git push
